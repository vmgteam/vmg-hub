let aT='tv', aS='Images', tvExp={}, tvCop={}, curImg=null, capOpen=false;

function filt(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let list=[];
  if(aT==='vert') list=[...IMGS];
  else if(aT==='sq'){
    list=SQ_IMGS.map(sq=>{
      const ref=IMGS.find(i=>i.id===sq.ref)||{cp:'Caption coming soon.'};
      return{...sq,cp:ref.cp};
    });
  }
  else if(aT==='web') list=IMGS.filter(i=>i.ct==='web');
  else if(aT==='pur') list=IMGS.filter(i=>i.ct==='pur');
  if(q) list=list.filter(i=>i.nm.toLowerCase().includes(q)||i.cp.toLowerCase().includes(q));
  return list;
}

  if(!list.length){document.getElementById('content').innerHTML=`<div class="empty">No images match that search.</div>`;return;}
  const tileClass = aT==='sq' ? 'tile sq-tile' : 'tile vert-tile';
  document.getElementById('content').innerHTML=`<div class="grid">${list.map(img=>`<div class="${tileClass}" onclick="openModal('${img.id}')"><img src="${img.src}" alt="${img.nm}" loading="lazy"><div class="tile-label">${img.nm}</div><span class="tile-cta ${img.ct==='web'?'cta-web':'cta-pur'}">${img.ct==='web'?'Webinar':'Purchase'}</span></div>`).join('')}</div>`;
}

function sT(id){aT=id;aS='Images';document.getElementById('search').value='';render()}
function sS(s){aS=s;render()}
function togTV(id){tvExp[id]=!tvExp[id];render()}
function copTV(id){
  const tv=ALLVID.find(t=>t.id===id);if(!tv)return;
  navigator.clipboard.writeText(tv.cp).catch(()=>{
    const t=document.createElement('textarea');t.value=tv.cp;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  });
  tvCop[id]=true;render();setTimeout(()=>{tvCop[id]=false;render()},2500);
}
function dlVid(file,btn){
  const url=vf(file);
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS){ window.open(url,'_blank'); return; }
  const orig=btn?btn.textContent:'';
  if(btn) btn.textContent='Downloading…';
  fetch(url).then(r=>r.blob()).then(blob=>{
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u;a.download=file;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(u),3000);
    if(btn) btn.textContent=orig;
  }).catch(()=>{ window.open(url,'_blank'); if(btn) btn.textContent=orig; });
}

let curVid=null, vCapOpen=false;
function openVid(id){
  curVid=ALLVID.find(v=>v.id===id); if(!curVid) return;
  vCapOpen=false;
  const vid=document.getElementById('vmodal-vid');
  vid.src=vf(curVid.file);
  document.getElementById('vmodal-name').textContent=curVid.nm;
  document.getElementById('vmodal-badges').innerHTML='<span class="badge b-web">Webinar CTA</span><span class="badge b-vid">Video</span>';
  document.getElementById('vmodal-cap').textContent=curVid.cp;
  document.getElementById('vmodal-cap').className='modal-cap';
  document.getElementById('vmodal-xbtn').textContent='See full caption ▼';
  document.getElementById('vmodal-copy').textContent='Copy Caption';
  document.getElementById('vmodal-copy').className='modal-copy';
  document.getElementById('vmodal-dl').textContent='⬇ Download Video';
  document.getElementById('vmodal').classList.add('show');
  document.body.style.overflow='hidden';
  history.pushState({hubModal:1},'');
}
function hideVid(){
  const vid=document.getElementById('vmodal-vid');
  vid.pause(); vid.removeAttribute('src'); vid.load();
  document.getElementById('vmodal').classList.remove('show');
  document.body.style.overflow='';
}
function closeVid(){
  if(history.state&&history.state.hubModal){ history.back(); } else { hideVid(); }
}
document.getElementById('vmodal').addEventListener('click',function(e){ if(e.target===this) closeVid(); });
function vToggleCap(){
  vCapOpen=!vCapOpen;
  document.getElementById('vmodal-cap').className='modal-cap'+(vCapOpen?' open':'');
  document.getElementById('vmodal-xbtn').textContent=vCapOpen?'Hide caption ▲':'See full caption ▼';
}
function vCopy(){
  if(!curVid)return;
  navigator.clipboard.writeText(curVid.cp).catch(()=>{
    const t=document.createElement('textarea');t.value=curVid.cp;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  });
  const b=document.getElementById('vmodal-copy');
  b.textContent='✓ Copied!';b.className='modal-copy done';
  setTimeout(()=>{b.textContent='Copy Caption';b.className='modal-copy';},2500);
}
function vDl(){ if(!curVid)return; dlVid(curVid.file, document.getElementById('vmodal-dl')); }

function lazyVideos(){
  const vids=document.querySelectorAll('.vcard-vid');
  if(!('IntersectionObserver' in window)){ vids.forEach(v=>{ v.preload='metadata'; try{v.load();}catch(e){} }); return; }
  const io=new IntersectionObserver(function(entries,obs){
    entries.forEach(function(e){
      if(e.isIntersecting){
        const v=e.target;
        v.preload='metadata';
        try{ v.load(); }catch(err){}
        obs.unobserve(v);
      }
    });
  },{rootMargin:'400px 0px'});
  vids.forEach(function(v){ io.observe(v); });
}

function openModal(id){
  curImg=IMGS.find(i=>i.id===id)||SQ_IMGS.find(i=>i.id===id);
  if(!curImg)return;
  if(!curImg.cp){const ref=IMGS.find(i=>i.id===curImg.ref);if(ref)curImg.cp=ref.cp;}
  capOpen=false;
  document.getElementById('modal-img').src=curImg.src;
  document.getElementById('modal-name').textContent=curImg.nm;
  document.getElementById('modal-badges').innerHTML=`<span class="badge ${curImg.ct==='web'?'b-web':'b-pur'}">${curImg.ct==='web'?'Webinar CTA':'Purchase CTA'}</span>`;
  document.getElementById('modal-cap').textContent=curImg.cp;
  document.getElementById('modal-cap').className='modal-cap';
  document.getElementById('modal-xbtn').textContent='See full caption ▼';
  document.getElementById('modal-copy').textContent='Copy Caption';
  document.getElementById('modal-copy').className='modal-copy';
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  document.getElementById('modal-save').textContent=isIOS?'Open Image to Save':'⬇ Save Image';
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow='hidden';
  history.pushState({hubModal:1},'');
}

function hideImg(){
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow='';
}
function closeModal(){
  if(history.state&&history.state.hubModal){ history.back(); } else { hideImg(); }
}

window.addEventListener('popstate',function(){
  if(document.getElementById('vmodal').classList.contains('show')) hideVid();
  if(document.getElementById('modal').classList.contains('show')) hideImg();
});

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

function toggleCap(){
  capOpen=!capOpen;
  document.getElementById('modal-cap').className='modal-cap'+(capOpen?' open':'');
  document.getElementById('modal-xbtn').textContent=capOpen?'Hide caption ▲':'See full caption ▼';
}

function doCopy(){
  if(!curImg)return;
  navigator.clipboard.writeText(curImg.cp).catch(()=>{
    const t=document.createElement('textarea');t.value=curImg.cp;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  });
  document.getElementById('modal-copy').textContent='✓ Copied!';
  document.getElementById('modal-copy').className='modal-copy done';
  setTimeout(()=>{
    document.getElementById('modal-copy').textContent='Copy Caption';
    document.getElementById('modal-copy').className='modal-copy';
  },2500);
}

function doSave(){
  if(!curImg)return;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS){
    window.open(curImg.src,'_blank');
  } else {
    const btn=document.getElementById('modal-save');
    btn.textContent='Saving...';
    fetch(curImg.src)
      .then(r=>r.blob())
      .then(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download=curImg.nm+'.jpeg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url),3000);
        btn.textContent='⬇ Save Image';
      })
      .catch(()=>{
        window.open(curImg.src,'_blank');
        btn.textContent='⬇ Save Image';
      });
  }
}

render();
</script>
